# Dashboard and API on one address. The browser loads the page from here and calls /api/... on
# the same origin, so it works at whatever address or name the Pi has on whatever network
# (http://192.168.1.50:8080, http://gos.local:8080, a VPN address), with no CORS setup.
server {
    listen 80;
    server_name _;

    # Docker's DNS, re-asked every 10 s: when the api container restarts with a new address,
    # the proxy follows it instead of returning 502 until nginx itself restarts
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:5000;

    root /usr/share/nginx/html;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    # scripts only from this origin; fonts from Google; API calls to this origin, or another
    # G.O.S. server the user enters in the dashboard (connect-src *)
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src *; img-src 'self' data:; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;   # the local language model can take a while
        client_max_body_size 64k;
    }

    location = /health {
        proxy_pass $api_upstream;
    }

    location = /nginx.conf { return 404; }
}

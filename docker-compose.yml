services:
  # === INFRASTRUCTURE LAYER ===

  # 1. TimescaleDB - Time-Series Optimized PostgreSQL
  # Required by ELEC 490/498: "Knowledge of common database design (e.g., postgres)"
  db:
    image: timescale/timescaledb:latest-pg15
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-researcher}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-strawberry_research}

    volumes:
      - timescale_data:/var/lib/postgresql/data
      - ./gateway/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      # database only on this machine; set DB_BIND=0.0.0.0 to open it to the network
      - "${DB_BIND:-127.0.0.1}:5432:5432"
    networks:
      - gos_net
    healthcheck:
      # ready only when the schema exists, with the configured user (was fixed to "researcher")
      test: [ "CMD-SHELL", "psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -c 'SELECT 1 FROM led_commands LIMIT 1' > /dev/null" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  # 2. Mosquitto MQTT Broker - Industry Standard for IoT
  # Required for Raspberry Pi → Gateway communication
  mqtt:
    image: eclipse-mosquitto:2
    ports:
      # MQTT accepts anonymous clients, so only on this machine by default; set MQTT_BIND=0.0.0.0
      # (and a password_file in monitoring/mosquitto/config) to take data from other instruments
      - "${MQTT_BIND:-127.0.0.1}:1883:1883"
      - "${MQTT_BIND:-127.0.0.1}:9001:9001"
    volumes:
      - ./monitoring/mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - gos_net
    restart: unless-stopped

  # === INGESTION & NETWORKING LAYER ===

  # 3. MQTT-to-Database Bridge (For real hardware)
  mqtt_bridge:
    build: ./gateway
    command: python services/mqtt_bridge.py
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-researcher}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}@db/${POSTGRES_DB:-strawberry_research}}
      - MQTT_BROKER=mqtt
      - MQTT_PORT=1883
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    networks:
      - gos_net
    restart: unless-stopped

  # 3b. CoAP receiver for real sensor nodes (Thread / PACKET_V4). Also the only path to the
  # LEDs: it signs each node's LED command after the safety monitor (led_safety.py).
  # Runs on the Thread border router host: host networking so it can join
  # ff03::1 on the Thread interface. Start with: docker compose --profile hardware up
  coap_receiver:
    build: ./gateway
    command: python services/coap_receiver.py
    network_mode: host
    profiles: ["hardware"]
    environment:
      # host networking: the database is at localhost, not at the DATABASE_URL the other services use
      - DATABASE_URL=postgresql://${POSTGRES_USER:-researcher}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}@localhost/${POSTGRES_DB:-strawberry_research}
      - COAP_PORT=5683
      - COAP_MULTICAST_GROUP=ff03::1
      - COAP_INTERFACE=${THREAD_INTERFACE:-wpan0}
      - GOS_NODE_KEYS=/run/gos/node_keys.json
      # LED safety monitor (gateway/services/led_safety.py)
      - LED_TZ=${LED_TZ:-America/Toronto}
      - LED_DARK_START=${LED_DARK_START:-22}
      - LED_DARK_END=${LED_DARK_END:-6}
      - LED_T_CUTOFF_C=${LED_T_CUTOFF_C:-32}
      - LED_MAX_STEP_PCT=${LED_MAX_STEP_PCT:-25}
    volumes:
      # written by: python gateway/tools/provision_node.py --index N
      - ./gateway/secrets/node_keys.json:/run/gos/node_keys.json:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 4. Phytotron Fleet Simulation (40 nRF52 nodes)
  # Replace with mqtt_bridge for real hardware deployment
  # Simulators: only with `--profile sim` (a PC demo without hardware). Real deployments leave
  # them off, so simulated rows never mix with real ones.
  ingest:
    build: ./gateway
    command: python services/farm_sim.py
    profiles: ["sim"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-researcher}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}@db/${POSTGRES_DB:-strawberry_research}}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gos_net

  # 5. Met-Station Simulation (Radiation & Spectral Irradiance)
  met_station:
    build: ./gateway
    command: python services/met_station.py
    profiles: ["sim"]
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-researcher}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}@db/${POSTGRES_DB:-strawberry_research}}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gos_net

  # 6. Research Support API (REST for Dashboard/GUI)
  # Handles Group 2 GUI inputs: events, yield, LED schedules
  api:
    build: ./gateway
    command: python services/api.py
    ports:
      # direct API port only on the Pi; from the network use http://PI:8080/api/ (nginx)
      - "${API_BIND:-127.0.0.1}:5000:5000"
    environment:
      # research assistant (services/assistant.py): Claude if a key is set, else the local
      # model in the ollama service (docker compose --profile assistant up), else rules
      # writes (LED settings, events) need this token; empty = API is read-only
      - GOS_API_TOKEN=${GOS_API_TOKEN:-}
      # trust X-Forwarded-For from nginx; set 0 if you open API_BIND to the network
      - GOS_TRUST_PROXY=${GOS_TRUST_PROXY:-1}
      # other web pages allowed to call the API from a browser (the dashboard needs none)
      - GOS_CORS_ORIGINS=${GOS_CORS_ORIGINS:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OLLAMA_URL=${OLLAMA_URL:-http://ollama:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-qwen2.5:1.5b}
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-researcher}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}@db/${POSTGRES_DB:-strawberry_research}}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/app/data:ro   # the curated dataset written by sync_engine, for /api/curated
    networks:
      - gos_net

  # === DATA BACKBONE (ELEC 490/498 Core Requirement) ===

  # 7. Synchronization Engine - Triple-Sync Data Curation
  # "Design and implement a robust (pre)processing pipeline to ingest,
  #  validate, synchronize, and curate data"
  sync_engine:
    build: ./gateway
    command: python services/sync.py
    volumes:
      - ./data:/app/data
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-researcher}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}@db/${POSTGRES_DB:-strawberry_research}}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gos_net

  # === PLANT MODEL AND LED CONTROL ===

  # 8. Biology engine: strawberry canopy model on live data (photosynthesis, transpiration,
  #    VPD, daily light integral) plus a 2 h climate forecast (Chronos-Bolt Tiny)
  biology_engine:
    build: ./ml_engine
    command: python biology_engine.py
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-researcher}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}@db/${POSTGRES_DB:-strawberry_research}}
      - FORECAST_BACKEND=${FORECAST_BACKEND:-chronos}
      - LED_TZ=${LED_TZ:-America/Toronto}
      - HF_HOME=/app/hf_cache
    volumes:
      - hf_cache:/app/hf_cache
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gos_net
    restart: unless-stopped

  # 9. LED controller: PPO policy trained on the plant model (models/led_policy.npz),
  #    writes led_setpoints; coap_receiver sends them to the nodes after the safety checks
  ml_engine:
    build: ./ml_engine
    command: python controller.py
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-researcher}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}@db/${POSTGRES_DB:-strawberry_research}}
      - CONTROL_POLICY=${CONTROL_POLICY:-ppo}
      - LED_TZ=${LED_TZ:-America/Toronto}
      - LED_DARK_START=${LED_DARK_START:-22}
      - LED_DARK_END=${LED_DARK_END:-6}
      - LED_T_CUTOFF_C=${LED_T_CUTOFF_C:-32}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gos_net
    restart: unless-stopped

  # 10. Local language model for the research assistant (optional, offline):
  #     docker compose --profile assistant up -d ollama
  #     docker compose exec ollama ollama pull qwen2.5:1.5b
  ollama:
    image: ollama/ollama:0.40.16
    profiles: ["assistant"]
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - gos_net
    restart: unless-stopped

  # === MONITORING & VISUALIZATION ===

  # 11. Grafana - Professional Dashboard
  grafana:
    image: grafana/grafana:13.2.6
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env, see .env.example}
      # read by provisioning/datasources/timescaledb.yml, so Grafana uses the same database
      # credentials as everything else (they were fixed in that file before)
      - POSTGRES_USER=${POSTGRES_USER:-researcher}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env, see .env.example}
      - POSTGRES_DB=${POSTGRES_DB:-strawberry_research}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - db
    networks:
      - gos_net

  # === USER INTERFACE (Group 2 GUI) ===

  # 12. G.O.S. Research Portal (Web Browser Based)
  # "Fully functional, annotatable, user-friendly GUI"
  dashboard:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./dashboard:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    networks:
      - gos_net

networks:
  gos_net:
    driver: bridge

volumes:
  timescale_data:
  grafana_data:
  mosquitto_data:
  mosquitto_logs:
  hf_cache:
  ollama_data:

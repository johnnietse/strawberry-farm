services:
  biology_engine:
    build:
      args:
        FORECAST: "0"
    environment:
      - BIO_PERIOD_S=10
      - LED_TZ=UTC
  ml_engine:
    build:
      args:
        FORECAST: "0"
    environment:
      - CONTROL_PERIOD_S=20
      - LED_TZ=UTC
  coap_receiver_e2e:
    build: ./gateway
    command: python services/coap_receiver.py
    environment:
      - DATABASE_URL=postgresql://researcher:REMOVED-DEFAULT-PASSWORD@db/strawberry_research
      - COAP_INTERFACE=
      - COAP_MULTICAST_GROUP=
      - GOS_NODE_KEYS=/run/gos/node_keys.json
      - LED_TZ=UTC
    volumes:
      - ./tests/e2e/node_keys.json:/run/gos/node_keys.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - gos_net
  fake_node:
    build: ./gateway
    command: python /e2e/fake_node.py
    profiles: ["e2e"]
    volumes:
      - ./tests/e2e:/e2e:ro
      - ./tests/e2e/node_keys.json:/run/gos/node_keys.json:ro
    networks:
      - gos_net
  db:
    ports: !reset []
  api:
    ports: !override
      - "5055:5000"

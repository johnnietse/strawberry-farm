# G.O.S. sensor node rev 3.0
#
# The SHT4x, TSL2591 and voltage-divider drivers switch themselves on from the
# devicetree once CONFIG_SENSOR is set, so they are not listed here.

CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_ADC=y
CONFIG_PWM=y
CONFIG_SENSOR=y
CONFIG_WATCHDOG=y

CONFIG_LOG=y

# Thread: minimal sleepy end device, network values from the rev 2 design.
# The network key comes from credentials.conf (not in git).
CONFIG_NETWORKING=y
CONFIG_NET_L2_OPENTHREAD=y
CONFIG_OPENTHREAD_MTD=y
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_POLL_PERIOD=1000
CONFIG_OPENTHREAD_COAP=y
CONFIG_OPENTHREAD_CHANNEL=15
CONFIG_OPENTHREAD_PANID=4660
CONFIG_OPENTHREAD_NETWORK_NAME="GOS_PHYTOTRON"
CONFIG_OPENTHREAD_XPANID="de:ad:00:be:ef:00:ca:fe"
CONFIG_NVS=y

# G.O.S. Sensor Node - Zephyr Configuration
# Hardware: nRF52840 (AQFN-73) + SX1262 LoRa + L76K GNSS + SHT40 + TSL2591 + AL8860x2 + BQ24075 + TPS62740 + DW01A/FS8205A

# ==================== Build & Toolchain ====================
CONFIG_CC_OPTIMIZE_FOR_SIZE=y
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LINKER_GC_SECTIONS=y

# ==================== Kernel ====================
CONFIG_MULTITHREADING=y
CONFIG_NUM_THREAD_LOCAL_STORAGE_GLOBAL=4
CONFIG_NUM_DYNAMIC_THREADS=8
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=1024
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

# ==================== Logging ====================
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_FRONTEND=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4

# ==================== Shell (Disabled for Production) ====================
CONFIG_SHELL=n

# ==================== Device Drivers ====================
# GPIO
CONFIG_GPIO=y
CONFIG_GPIO_NRF5=y

# I2C
CONFIG_I2C=y
CONFIG_I2C_NRFX_TWIM=y
CONFIG_I2C_NRFX_TWIM_DEFAULT_CONFIG_FREQUENCY=100000

# SPI
CONFIG_SPI=y
CONFIG_SPI_NRFX=y

# UART
CONFIG_SERIAL=y
CONFIG_UART_NRFX_UARTE=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_ASYNC_API=y

# PWM
CONFIG_PWM=y
CONFIG_PWM_NRF5_SW=y

# ADC
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_ADC_NRFX_SAADC_RESOLUTION_12BIT=y
CONFIG_ADC_NRFX_SAADC_ACQ_TIME_3US=y

# Flash
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_SPI_NOR=y

# NVS / Settings
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y

# Flash Map
CONFIG_FLASH_MAP=y

# ==================== Sensors ====================
CONFIG_SENSOR=y
CONFIG_SHT4X=y
CONFIG_TSL2591=y

# ==================== PWM ====================
CONFIG_PWM_NRF5_SW=y

# ==================== Power Management ====================
CONFIG_PM=y
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y
CONFIG_PM_POLICY=y
CONFIG_PM_STATE_SOFT_OFF=y
CONFIG_PM_STATE_SUSPEND_TO_IDLE=y
CONFIG_PM_DEVICE_RUNTIME_AUTO=y

# ==================== Power Management (Device) ====================
CONFIG_PM_DEVICE_RUNTIME=y

# ==================== Watchdog ====================
CONFIG_WDT=y
CONFIG_WDT_NRFX=y

# ==================== Hardware Info ====================
CONFIG_HWINFO=y

# ==================== Bluetooth / Thread ====================
CONFIG_BT=n
CONFIG_OPENTHREAD=y
CONFIG_OPENTHREAD_NORDIC_LIBRARY_MTD=y
CONFIG_OPENTHREAD_MTD_SED=y
CONFIG_OPENTHREAD_POLL_PERIOD=1000
CONFIG_OPENTHREAD_COAP=y
CONFIG_OPENTHREAD_COAP_API=y
CONFIG_OPENTHREAD_DNS=y
CONFIG_OPENTHREAD_SRP_CLIENT=y
CONFIG_OPENTHREAD_SRP_CLIENT_AUTO_START=y
CONFIG_OPENTHREAD_BORDER_ROUTER=n
CONFIG_OPENTHREAD_COMMISSIONER=n
CONFIG_OPENTHREAD_JOINER=n
CONFIG_OPENTHREAD_NETDATA_PUBLISHER=y
CONFIG_OPENTHREAD_CHILD_SUPERVISION=y
CONFIG_OPENTHREAD_CHILD_SUPERVISION_INTERVAL=300
CONFIG_OPENTHREAD_CHILD_SUPERVISION_CHECK_TIMEOUT=30
CONFIG_OPENTHREAD_LOG_LEVEL_DBG=n
CONFIG_OPENTHREAD_LOG_LEVEL_INF=y
CONFIG_OPENTHREAD_LOG_LEVEL_WRN=y
CONFIG_OPENTHREAD_LOG_LEVEL_ERR=y
CONFIG_OPENTHREAD_LOG_LEVEL_CRIT=y

# ==================== Network ====================
CONFIG_NETWORKING=y
CONFIG_NET_IPV6=y
CONFIG_NET_IPV6_MLD=y
CONFIG_NET_UDP=y
CONFIG_NET_TCP=n
CONFIG_NET_SOCKETS=y
CONFIG_NET_SOCKETS_POSIX_NAMES=y
CONFIG_NET_SOCKETS_POLL_MAX=4
CONFIG_NET_BUF_POOLS_NUM=2
CONFIG_NET_PKT_RX_COUNT=8
CONFIG_NET_PKT_TX_COUNT=8
CONFIG_NET_BUF_DATA_SIZE=256
CONFIG_NET_BUF_RX_RESERVE=64
CONFIG_NET_BUF_TX_RESERVE=64

# ==================== CoAP ====================
CONFIG_COAP=y
CONFIG_COAP_EXTENDED_OPTIONS=y
CONFIG_COAP_BLOCK_WISE_TRANSFER=y
CONFIG_COAP_OBSERVE=y
CONFIG_COAP_BLOCK_WISE_TRANSFER_SZX_MAX=6
CONFIG_COAP_MAX_MESSAGE_SIZE=1152
CONFIG_COAP_MAX_PAYLOAD_SIZE=1024

# ==================== IEEE 802.15.4 ====================
CONFIG_IEEE802154=y
CONFIG_IEEE802154_NRF5=y
CONFIG_IEEE802154_NRF5_TX_POWER=8
CONFIG_IEEE802154_NRF5_CHANNEL=11
CONFIG_IEEE802154_NRF5_PAN_ID=0xABCD
CONFIG_IEEE802154_NRF5_EXTENDED_ADDRESS=0x0000000000000000

# ==================== Crypto ====================
CONFIG_TINYCRYPT=y
CONFIG_MBEDTLS=y
CONFIG_MBEDTLS_AES_C=y
CONFIG_MBEDTLS_CCM_C=y
CONFIG_MBEDTLS_ECP_C=y
CONFIG_MBEDTLS_ECP_DP_SECP256R1_ENABLED=y
CONFIG_MBEDTLS_SHA256_C=y
CONFIG_MBEDTLS_HKDF_C=y

# ==================== Random ====================
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y

# ==================== Power Management ICs ====================
# BQ24075 Charger (I2C)
CONFIG_I2C=y
CONFIG_BQ24075=y

# TPS62740 Buck (PG pin monitoring)
CONFIG_GPIO=y

# DW01A Protection IC
CONFIG_GPIO=y

# ==================== ADC ====================
CONFIG_ADC=y
CONFIG_ADC_NRFX_SAADC=y
CONFIG_ADC_NRFX_SAADC_RESOLUTION_12BIT=y
CONFIG_ADC_NRFX_SAADC_ACQ_TIME_3US=y
CONFIG_ADC_NRFX_SAADC_CHANNEL_COUNT=3

# ==================== PWM ====================
CONFIG_PWM_NRF5_SW=y

# ==================== Watchdog ====================
CONFIG_WDT=y
CONFIG_WDT_NRFX=y

# ==================== NVS / Flash ====================
CONFIG_FLASH=y
CONFIG_FLASH_PAGE_LAYOUT=y
CONFIG_NORDIC_QSPI_NOR=y
CONFIG_SPI_NOR=y
CONFIG_FLASH_MAP=y

# ==================== NVS ====================
CONFIG_SETTINGS=y
CONFIG_SETTINGS_NVS=y
CONFIG_NVS=y

# ==================== Logging ====================
CONFIG_LOG=y
CONFIG_LOG_MODE_MINIMAL=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=2048
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_FRONTEND=y
CONFIG_LOG_RUNTIME_FILTERING=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_LOG_MAX_LEVEL=4

# ==================== Shell ====================
CONFIG_SHELL=n

# ==================== Debug ====================
CONFIG_DEBUG=y
CONFIG_DEBUG_COREDUMP=y
CONFIG_DEBUG_COREDUMP_BACKEND_LOGGING=y
CONFIG_DEBUG_COREDUMP_BACKEND_FLASH=n
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_THREAD_RUNTIME_STATS=y

# ==================== Stack Protection ====================
CONFIG_HW_STACK_PROTECTION=y
CONFIG_STACK_SENTINEL=y
CONFIG_STACK_CANARIES=y

# ==================== Build Optimization ====================
CONFIG_CC_OPTIMIZE_FOR_SIZE=y
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_LINKER_GC_SECTIONS=y

# ==================== Custom Config ====================
CONFIG_GOS_SENSOR_NODE=y
CONFIG_GOS_SENSOR_NODE_VERSION="2.0.0"
CONFIG_GOS_SENSOR_NODE_BATTERY_ADC=y
CONFIG_GOS_SENSOR_NODE_BQ24075=y
CONFIG_GOS_SENSOR_NODE_TPS62740=y
CONFIG_GOS_SENSOR_NODE_DW01A=y
CONFIG_GOS_SENSOR_NODE_SX1262=y
CONFIG_GOS_SENSOR_NODE_L76K=y
CONFIG_GOS_SENSOR_NODE_AL8860=y
CONFIG_GOS_SENSOR_NODE_EXT_FLASH=y
CONFIG_GOS_SENSOR_NODE_WATCHDOG=y
CONFIG_GOS_SENSOR_NODE_POWER_MGMT=y
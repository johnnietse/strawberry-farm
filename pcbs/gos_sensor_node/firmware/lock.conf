# Field build, locked: blocks all debugger access, so the node's signing key and the Thread
# network key cannot be read out of flash.
#   west build -b raytac_mdbt50q_db_40/nrf52840 -- -DEXTRA_CONF_FILE="low_power.conf;lock.conf"
# Afterwards the only way back in is a full chip erase (nrfjprog --recover), which also
# erases the message-counter epoch: re-provision the node (new key) before reflashing,
# or the gateway rejects its packets as replays. Use only for nodes going into service.
CONFIG_NRF_APPROTECT_LOCK=y

# Field build: no debug console or logging.
#   west build -b raytac_mdbt50q_db_40/nrf52840 -- -DEXTRA_CONF_FILE=low_power.conf
# The nRF52840 UART receiver keeps the high-frequency clock running while it
# is enabled, which costs far more than the rest of the sleeping board.
# Use the normal build on the bench, this one in the phytotron.
CONFIG_LOG=n
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n

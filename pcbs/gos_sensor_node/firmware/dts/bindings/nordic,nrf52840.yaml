description: Nordic nRF52840 MCU
compatible: "nordic,nrf52840"
include: [base.yaml]
properties:
  reg:
    type: array
    required: true
    description: Register address space
  interrupts:
    type: array
    required: true
    description: Interrupts
  clocks:
    type: phandle-array
    required: true
    description: Clock sources
  clock-names:
    type: string-array
    required: true
    description: Clock names
  status:
    type: string
    default: "okay"
    description: Device status
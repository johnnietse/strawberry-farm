description: Texas Instruments TPS62740 Buck Converter
compatible: "ti,tps62740"
include: [gpio-device.yaml]
properties:
  en-gpios:
    type: phandle-array
    required: true
    description: Enable pin
  vsel0-gpios:
    type: phandle-array
    required: true
    description: Voltage Select 0
  vsel1-gpios:
    type: phandle-array
    required: true
    description: Voltage Select 1
  pg-gpios:
    type: phandle-array
    required: true
    description: Power Good output
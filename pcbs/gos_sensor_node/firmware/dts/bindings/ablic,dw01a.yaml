description: ABlic DW01A Battery Protection IC
compatible: "ablic,dw01a"
include: [gpio-device.yaml]
properties:
  od-gpios:
    type: phandle-array
    required: true
    description: Over-discharge output
  oc-gpios:
    type: phandle-array
    required: true
    description: Over-current output
  cs-gpios:
    type: phandle-array
    required: true
    description: Current sense input
  vcc-gpios:
    type: phandle-array
    required: true
    description: VCC monitor input
  gnd-gpios:
    type: phandle-array
    description: Ground reference
  ov-threshold-mv:
    type: int
    default: 4250
    description: Over-voltage threshold in mV
  uv-threshold-mv:
    type: int
    default: 2400
    description: Under-voltage threshold in mV
  oc-threshold-mv:
    type: int
    default: 150
    description: Over-current threshold in mV
  oc-delay-ms:
    type: int
    default: 100
    description: Over-current delay in ms
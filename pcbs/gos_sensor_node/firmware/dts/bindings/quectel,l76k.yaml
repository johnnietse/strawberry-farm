description: Quectel L76K GNSS Module
compatible: "quectel,l76k"
include: [uart-device.yaml]
properties:
  uart:
    type: phandle
    required: true
    description: UART interface
  pps-gpios:
    type: phandle-array
    description: PPS output pin
  current-speed:
    type: int
    default: 9600
    description: Baud rate
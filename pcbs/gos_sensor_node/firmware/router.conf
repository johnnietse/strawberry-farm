# Router build: for a node on permanent USB power (a 5 V USB-C adapter; the BQ24074 runs the
# board from USB and keeps the cell charged). The radio stays on, so the node relays for its
# neighbours and the network becomes a real mesh: nodes beyond the border router's range join
# through it. On battery alone a router lasts only days.
#   west build -b raytac_mdbt50q_db_40/nrf52840 -- -DEXTRA_CONF_FILE=router.conf
# Put one router node every 10 to 20 m, or wherever a sleepy node cannot reach the dongle.
CONFIG_OPENTHREAD_MTD=n
CONFIG_OPENTHREAD_MTD_SED=n
CONFIG_OPENTHREAD_FTD=y

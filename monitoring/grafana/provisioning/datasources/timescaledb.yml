# Grafana datasource: the project database, with the credentials from .env (passed to the
# grafana container in docker-compose.yml; Grafana expands $VARIABLES in provisioning files).
apiVersion: 1

datasources:
  - name: TimescaleDB
    uid: gos-timescaledb
    type: postgres
    url: db:5432
    user: $POSTGRES_USER
    secureJsonData:
      password: $POSTGRES_PASSWORD
    jsonData:
      database: $POSTGRES_DB
      sslmode: disable
      maxOpenConns: 10
      maxIdleConns: 5
      connMaxLifetime: 14400
      postgresVersion: 1500
      timescaledb: true
    isDefault: true
    editable: false
